name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    labels: ["feat", "feature"]
  - title: "🐛 Bug Fixes"
    labels: ["fix", "bug"]
  - title: "🧰 Maintenance"
    labels: ["chore", "refactor", "docs", "ci", "build", "perf", "test", "style"]

autolabeler:
  - label: "feat"
    title: "/^feat(\\(.*\\))?!?:/"
  - label: "fix"
    title: "/^fix(\\(.*\\))?!?:/"
  - label: "chore"
    title: "/^(chore|refactor|docs|ci|build|perf|test|style)(\\(.*\\))?!?:/"

version-resolver:
  major:
    labels: ["major", "breaking"]
  minor:
    labels: ["feat", "feature"]
  patch:
    labels: ["fix", "bug", "chore", "refactor", "docs", "ci", "build", "perf", "test", "style"]
  default: patch

change-template: "- $TITLE (#$NUMBER)"
template: |
  ## Changes

  $CHANGES
